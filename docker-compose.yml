version: "3.8"

# Minimal local development stack for the enterprise-blockchain repository.
# Start with: docker compose up -d
# Stop with:  docker compose down -v

networks:
  enterprise-blockchain:
    name: enterprise-blockchain-net

services:
  # ── Besu dev-mode miner nodes ──────────────────────────────────────
  # RPC binds to 0.0.0.0 inside the container; host ports are published
  # on 127.0.0.1 only. CORS and host-allowlist restricted for local-dev.
  besu-validator-0:
    image: hyperledger/besu:24.12.2
    container_name: besu-validator-0
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:8545:8545"
    command:
      - --network=dev
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-cors-origins=http://localhost
      - --host-allowlist=localhost,127.0.0.1
      - --miner-enabled
      - --miner-coinbase=0x0000000000000000000000000000000000000000
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:8545",
          "-X",
          "POST",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  besu-validator-1:
    image: hyperledger/besu:24.12.2
    container_name: besu-validator-1
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:8546:8545"
    command:
      - --network=dev
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-cors-origins=http://localhost
      - --host-allowlist=localhost,127.0.0.1
      - --miner-enabled
      - --miner-coinbase=0x0000000000000000000000000000000000000001
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-sf",
          "http://localhost:8545",
          "-X",
          "POST",
          "-H",
          "Content-Type: application/json",
          "-d",
          '{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Fabric test network (minimal) ──────────────────────────────────
  fabric-orderer:
    image: hyperledger/fabric-orderer:2.5
    container_name: fabric-orderer
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:7050:7050"
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=none
      - ORDERER_CHANNELPARTICIPATION_ENABLED=true
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -z localhost 7050"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  fabric-peer-org1:
    image: hyperledger/fabric-peer:2.5
    container_name: fabric-peer-org1
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:7051:7051"
    environment:
      - CORE_PEER_ID=peer0.org1.example.com
      - CORE_PEER_LOCALMSPID=Org1MSP
      - FABRIC_LOGGING_SPEC=INFO
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -z localhost 7051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  fabric-peer-org2:
    image: hyperledger/fabric-peer:2.5
    container_name: fabric-peer-org2
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:7052:7051"
    environment:
      - CORE_PEER_ID=peer0.org2.example.com
      - CORE_PEER_LOCALMSPID=Org2MSP
      - FABRIC_LOGGING_SPEC=INFO
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -z localhost 7051"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ── Corda nodes ────────────────────────────────────────────────────
  corda-notary:
    image: corda/corda-zulu-java11-5.1:5.1
    container_name: corda-notary
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:10006:10006"
    environment:
      - MY_LEGAL_NAME=O=Notary,L=London,C=GB
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -z localhost 10006"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  corda-partya:
    image: corda/corda-zulu-java11-5.1:5.1
    container_name: corda-partya
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:10007:10006"
    environment:
      - MY_LEGAL_NAME=O=PartyA,L=London,C=GB
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -z localhost 10006"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  corda-partyb:
    image: corda/corda-zulu-java11-5.1:5.1
    container_name: corda-partyb
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:10008:10006"
    environment:
      - MY_LEGAL_NAME=O=PartyB,L=London,C=GB
    healthcheck:
      test: ["CMD-SHELL", "echo | nc -z localhost 10006"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Observability stack ─────────────────────────────────────────────
  # OpenTelemetry Collector receives OTLP traces/metrics and forwards to
  # Jaeger (traces) and Prometheus (metrics). Applications send telemetry
  # to http://localhost:4318 (OTLP HTTP).
  #
  # Ref: https://opentelemetry.io/docs/collector/
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: otel-collector
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
      - "127.0.0.1:8889:8889" # Prometheus metrics endpoint
      - "127.0.0.1:13133:13133" # Health check endpoint
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - jaeger

  # Jaeger all-in-one for distributed tracing visualization.
  # UI available at http://localhost:16686
  #
  # Ref: https://www.jaegertracing.io/docs/latest/getting-started/
  jaeger:
    image: jaegertracing/all-in-one:1.54
    container_name: jaeger
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:16686:16686" # Jaeger UI
      - "127.0.0.1:14250:14250" # gRPC model.proto
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Prometheus for metrics collection and alerting.
  # UI available at http://localhost:9090
  #
  # Ref: https://prometheus.io/docs/prometheus/latest/installation/
  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: prometheus
    networks:
      - enterprise-blockchain
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
