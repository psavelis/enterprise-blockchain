# Prometheus configuration for enterprise-blockchain observability.
#
# Scrapes metrics from the OpenTelemetry Collector's Prometheus exporter.
#
# Ref: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape OpenTelemetry Collector metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    metric_relabel_configs:
      # Keep enterprise_blockchain namespace metrics
      - source_labels: [__name__]
        regex: "enterprise_blockchain_.*"
        action: keep

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
