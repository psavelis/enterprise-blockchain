name: Observability Stack

on:
  push:
    branches: [main, master]
    paths:
      - "docker-compose.yml"
      - "infra/otel-collector-config.yaml"
      - "infra/prometheus.yaml"
      - "modules/shared/src/telemetry*.ts"
      - "modules/integrations/shared/src/retry.ts"
      - ".github/workflows/infra-observability.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "infra/otel-collector-config.yaml"
      - "infra/prometheus.yaml"
      - "modules/shared/src/telemetry*.ts"
      - "modules/integrations/shared/src/retry.ts"
      - ".github/workflows/infra-observability.yml"

permissions:
  contents: read

jobs:
  validate-observability:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start observability stack
        run: |
          docker compose up -d jaeger prometheus otel-collector
          echo "Waiting for services to be healthy..."
          sleep 15

      - name: Verify Jaeger is running
        run: |
          curl -sf http://localhost:16686/ > /dev/null
          echo "✓ Jaeger UI is accessible"

      - name: Verify Prometheus is running
        run: |
          curl -sf http://localhost:9090/-/healthy > /dev/null
          echo "✓ Prometheus is healthy"

      - name: Verify OTEL Collector is running
        run: |
          curl -sf http://localhost:13133/ > /dev/null
          echo "✓ OTEL Collector health check passed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run example with telemetry enabled
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_SERVICE_NAME: ci-test-service
        run: |
          npm run example:food-recall
          echo "✓ Example completed with telemetry enabled"

      - name: Wait for telemetry export
        run: sleep 10

      - name: Verify traces in Jaeger
        run: |
          # Query Jaeger API for services
          SERVICES=$(curl -sf "http://localhost:16686/api/services" | jq -r '.data[]' || echo "")
          if [ -z "$SERVICES" ]; then
            echo "⚠ No services found in Jaeger (telemetry may not be fully propagated in CI)"
            echo "This is expected - traces require active spans to be exported"
          else
            echo "✓ Found services in Jaeger: $SERVICES"
          fi

      - name: Verify Prometheus scrape target
        run: |
          # Check if otel-collector target is up
          TARGETS=$(curl -sf "http://localhost:9090/api/v1/targets" | jq -r '.data.activeTargets[].health' || echo "")
          echo "Prometheus targets health: $TARGETS"
          if echo "$TARGETS" | grep -q "up"; then
            echo "✓ Prometheus is scraping otel-collector"
          else
            echo "⚠ Prometheus target not fully up yet (expected in short CI runs)"
          fi

      - name: Cleanup
        if: always()
        run: docker compose down -v
