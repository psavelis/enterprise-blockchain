name: Release

# DISABLED: Branch protection rules require changes through PRs.
# semantic-release cannot push directly to main with current ruleset.
# Re-enable when branch protection is configured to allow GitHub Actions.
# on:
#   push:
#     branches:
#       - main
#   workflow_dispatch:

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no actual release)"
        required: false
        default: "true"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository == 'psavelis/enterprise-blockchain'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify quality gate
        run: npm run ci:core

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
