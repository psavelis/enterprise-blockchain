name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: core
            order: 1
            name: Core validation
            command: npm run ci:core
            covers: Prettier format check, ESLint, TypeScript typecheck, unit tests, and primary business scenario examples
          - id: protocol-projections
            order: 2
            name: Protocol projections
            command: npm run ci:protocol-projections
            covers: Fabric, Besu, and Corda protocol projection examples
          - id: demos
            order: 3
            name: Demo scripts
            command: npm run ci:demos
            covers: Adapter projection demo and integration client demo outputs
          - id: integration-examples
            order: 4
            name: Integration examples
            command: npm run ci:integration-examples
            covers: Fabric Gateway, Besu ethers, and Corda gateway integration entrypoints

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run suite
        id: run_suite
        continue-on-error: true
        run: ${{ matrix.suite.command }}

      - name: Write suite report
        if: always()
        run: |
          mkdir -p ci-results
          cat <<EOF > ci-results/${{ matrix.suite.id }}.json
          {
            "id": "${{ matrix.suite.id }}",
            "order": ${{ matrix.suite.order }},
            "name": "${{ matrix.suite.name }}",
            "command": "${{ matrix.suite.command }}",
            "covers": "${{ matrix.suite.covers }}",
            "outcome": "${{ steps.run_suite.outcome }}"
          }
          EOF

      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ matrix.suite.id }}
          path: ci-results/${{ matrix.suite.id }}.json

      - name: Fail on suite error
        if: steps.run_suite.outcome != 'success'
        run: exit 1

  pr-comment:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Download suite reports
        uses: actions/download-artifact@v8
        with:
          pattern: ci-result-*
          merge-multiple: true
          path: ci-results

      - name: Publish PR report comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- enterprise-blockchain-ci-report -->';
            const dir = path.join(process.cwd(), 'ci-results');
            const files = fs.readdirSync(dir).filter((file) => file.endsWith('.json')).sort();
            const reports = files
              .map((file) => JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8')))
              .sort((left, right) => {
                const leftOrder = typeof left.order === 'number' ? left.order : Number.MAX_SAFE_INTEGER;
                const rightOrder = typeof right.order === 'number' ? right.order : Number.MAX_SAFE_INTEGER;
                return leftOrder - rightOrder || left.name.localeCompare(right.name);
              });

            const passed = reports.filter((report) => report.outcome === 'success').length;
            const failed = reports.length - passed;
            const overall = failed === 0 ? 'PASS' : 'FAIL';
            const emoji = failed === 0 ? '✅' : '❌';

            const rows = reports.map((report) => {
              const result = report.outcome === 'success' ? 'PASS' : 'FAIL';
              return `| ${report.name} | \`${report.command}\` | ${report.covers} | ${result} |`;
            }).join('\n');

            const body = [
              marker,
              '## CI Report',
              '',
              `${emoji} Overall result: **${overall}**`,
              '',
              '| Suite | Command | Coverage | Result |',
              '|---|---|---|---|',
              rows,
              '',
              '**Repository coverage**',
              '',
              '- Core quality gate: format check, lint, typecheck, tests, and primary business scenarios',
              '- Protocol projection coverage: Fabric, Besu, and Corda projection entrypoints',
              '- Demonstration coverage: adapter and integration demo scripts',
              '- Integration coverage: Fabric Gateway, Besu ethers, and Corda gateway examples',
              '',
              '**Summary**',
              '',
              `- Passed suites: ${passed}`,
              `- Failed suites: ${failed}`,
              '- Node runtime: 22.13.0',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
