name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: core
            order: 1
            name: Core validation
            command: npm run ci:core
            covers: Prettier format check, ESLint, TypeScript typecheck, unit tests, and primary business scenario examples
          - id: protocol-projections
            order: 2
            name: Protocol projections
            command: npm run ci:protocol-projections
            covers: Fabric, Besu, and Corda protocol projection examples
          - id: demos
            order: 3
            name: Demo scripts
            command: npm run ci:demos
            covers: Adapter projection demo and integration client demo outputs
          - id: integration-examples
            order: 4
            name: Integration examples
            command: npm run ci:integration-examples
            covers: Fabric Gateway, Besu ethers, and Corda gateway integration entrypoints

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run suite
        id: run_suite
        continue-on-error: true
        env:
          NODE_ENV: test
        run: |
          if [ "${{ matrix.suite.id }}" = "core" ]; then
            # Run format check, lint, typecheck separately
            npm run format:check
            npm run lint
            npm run typecheck
            # Run tests with TAP reporter to capture individual test names
            node --import tsx --test tests/**/*.test.ts --test-reporter tap 2>&1 | tee test-output.tap
            TEST_EXIT=${PIPESTATUS[0]}
            # Also capture test summary from spec reporter for accurate counts
            node --import tsx --test tests/**/*.test.ts 2>&1 | tee test-output.spec || true
            # Run examples
            npm run examples
            exit $TEST_EXIT
          else
            ${{ matrix.suite.command }}
          fi

      - name: Parse test results
        if: always() && matrix.suite.id == 'core'
        id: parse_tests
        run: |
          if [ -f test-output.tap ]; then
            # Extract test names from TAP output (top-level tests)
            PASSED=$(grep -E "^ok [0-9]+ - " test-output.tap | sed 's/^ok [0-9]* - //' | head -100 || true)
            FAILED=$(grep -E "^not ok [0-9]+ - " test-output.tap | sed 's/^not ok [0-9]* - //' | head -100 || true)

            # Get accurate counts from spec reporter output (includes nested tests)
            if [ -f test-output.spec ]; then
              TOTAL_PASSED=$(grep -E "^# pass [0-9]+" test-output.spec | awk '{print $3}' || true)
              TOTAL_FAILED=$(grep -E "^# fail [0-9]+" test-output.spec | awk '{print $3}' || true)
              TOTAL_TESTS=$(grep -E "^# tests [0-9]+" test-output.spec | awk '{print $3}' || true)
            fi

            # Fallback to TAP counts if spec not available
            if [ -z "$TOTAL_PASSED" ]; then
              TOTAL_PASSED=$(grep -cE "^ok [0-9]+ - " test-output.tap 2>/dev/null || true)
            fi
            if [ -z "$TOTAL_FAILED" ]; then
              TOTAL_FAILED=$(grep -cE "^not ok [0-9]+ - " test-output.tap 2>/dev/null || true)
            fi

            # Default to 0 if empty
            TOTAL_PASSED=${TOTAL_PASSED:-0}
            TOTAL_FAILED=${TOTAL_FAILED:-0}

            # Write to file for JSON inclusion (escape for JSON)
            echo "$PASSED" | jq -Rs '.' > passed-tests.txt
            echo "$FAILED" | jq -Rs '.' > failed-tests.txt

            echo "total_passed=${TOTAL_PASSED}" >> "$GITHUB_OUTPUT"
            echo "total_failed=${TOTAL_FAILED}" >> "$GITHUB_OUTPUT"
          else
            echo '""' > passed-tests.txt
            echo '""' > failed-tests.txt
            echo "total_passed=0" >> "$GITHUB_OUTPUT"
            echo "total_failed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Write suite report
        if: always()
        run: |
          mkdir -p ci-results
          if [ "${{ matrix.suite.id }}" = "core" ] && [ -f passed-tests.txt ]; then
            PASSED_TESTS=$(cat passed-tests.txt)
            FAILED_TESTS=$(cat failed-tests.txt)
            TOTAL_PASSED=${{ steps.parse_tests.outputs.total_passed || '0' }}
            TOTAL_FAILED=${{ steps.parse_tests.outputs.total_failed || '0' }}
            cat <<EOF > ci-results/${{ matrix.suite.id }}.json
          {
            "id": "${{ matrix.suite.id }}",
            "order": ${{ matrix.suite.order }},
            "name": "${{ matrix.suite.name }}",
            "command": "${{ matrix.suite.command }}",
            "covers": "${{ matrix.suite.covers }}",
            "outcome": "${{ steps.run_suite.outcome }}",
            "tests": {
              "passed": $PASSED_TESTS,
              "failed": $FAILED_TESTS,
              "totalPassed": $TOTAL_PASSED,
              "totalFailed": $TOTAL_FAILED
            }
          }
          EOF
          else
            cat <<EOF > ci-results/${{ matrix.suite.id }}.json
          {
            "id": "${{ matrix.suite.id }}",
            "order": ${{ matrix.suite.order }},
            "name": "${{ matrix.suite.name }}",
            "command": "${{ matrix.suite.command }}",
            "covers": "${{ matrix.suite.covers }}",
            "outcome": "${{ steps.run_suite.outcome }}"
          }
          EOF
          fi

      - name: Upload suite report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ matrix.suite.id }}
          path: ci-results/${{ matrix.suite.id }}.json

      - name: Fail on suite error
        if: steps.run_suite.outcome != 'success'
        run: exit 1

  pr-comment:
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Download suite reports
        uses: actions/download-artifact@v8
        with:
          pattern: ci-result-*
          merge-multiple: true
          path: ci-results

      - name: Publish PR report comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- enterprise-blockchain-ci-report -->';
            const dir = path.join(process.cwd(), 'ci-results');
            const files = fs.readdirSync(dir).filter((file) => file.endsWith('.json')).sort();
            const reports = files
              .map((file) => JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8')))
              .sort((left, right) => {
                const leftOrder = typeof left.order === 'number' ? left.order : Number.MAX_SAFE_INTEGER;
                const rightOrder = typeof right.order === 'number' ? right.order : Number.MAX_SAFE_INTEGER;
                return leftOrder - rightOrder || left.name.localeCompare(right.name);
              });

            const passed = reports.filter((report) => report.outcome === 'success').length;
            const failed = reports.length - passed;
            const overall = failed === 0 ? 'PASS' : 'FAIL';
            const emoji = failed === 0 ? '✅' : '❌';

            const rows = reports.map((report) => {
              const result = report.outcome === 'success' ? 'PASS' : 'FAIL';
              return `| ${report.name} | \`${report.command}\` | ${report.covers} | ${result} |`;
            }).join('\n');

            // Build test details section for core suite
            let testDetails = '';
            const coreReport = reports.find((r) => r.id === 'core');
            if (coreReport?.tests) {
              const { totalPassed, totalFailed, passed: passedTests, failed: failedTests } = coreReport.tests;
              const totalTests = totalPassed + totalFailed;
              const testStatus = totalFailed === 0 ? '✅' : '❌';

              // Parse test names from the escaped strings
              const passedList = passedTests ? passedTests.trim().split('\n').filter(Boolean) : [];
              const failedList = failedTests ? failedTests.trim().split('\n').filter(Boolean) : [];

              let testTable = '';
              if (failedList.length > 0) {
                testTable += '\n**Failed Tests:**\n';
                failedList.slice(0, 20).forEach((t) => {
                  testTable += `- ❌ ${t}\n`;
                });
                if (failedList.length > 20) {
                  testTable += `- ... and ${failedList.length - 20} more\n`;
                }
              }

              if (passedList.length > 0) {
                testTable += '\n**Passed Tests:**\n';
                passedList.slice(0, 50).forEach((t) => {
                  testTable += `- ✅ ${t}\n`;
                });
                if (passedList.length > 50) {
                  testTable += `- ... and ${passedList.length - 50} more\n`;
                }
              }

              testDetails = [
                '',
                '<details>',
                `<summary>${testStatus} <strong>Unit Tests: ${totalPassed}/${totalTests} passed</strong></summary>`,
                '',
                '| Metric | Value |',
                '|--------|-------|',
                `| Total Tests | ${totalTests} |`,
                `| Passed | ${totalPassed} |`,
                `| Failed | ${totalFailed} |`,
                testTable,
                '</details>',
              ].join('\n');
            }

            // Build integration suites summary
            const integrationSuites = reports.filter((r) => r.id !== 'core');
            if (integrationSuites.length > 0) {
              const integrationPassed = integrationSuites.filter((r) => r.outcome === 'success').length;
              const integrationStatus = integrationPassed === integrationSuites.length ? '✅' : '❌';

              let integrationList = '';
              integrationSuites.forEach((suite) => {
                const status = suite.outcome === 'success' ? '✅' : '❌';
                integrationList += `- ${status} ${suite.name}\n`;
              });

              testDetails += [
                '',
                '<details>',
                `<summary>${integrationStatus} <strong>Integration Suites: ${integrationPassed}/${integrationSuites.length} passed</strong></summary>`,
                '',
                integrationList,
                '</details>',
              ].join('\n');
            }

            const body = [
              marker,
              '## CI Report',
              '',
              `${emoji} Overall result: **${overall}**`,
              '',
              '| Suite | Command | Coverage | Result |',
              '|---|---|---|---|',
              rows,
              testDetails,
              '',
              '**Repository coverage**',
              '',
              '- Core quality gate: format check, lint, typecheck, tests, and primary business scenarios',
              '- Protocol projection coverage: Fabric, Besu, and Corda projection entrypoints',
              '- Demonstration coverage: adapter and integration demo scripts',
              '- Integration coverage: Fabric Gateway, Besu ethers, and Corda gateway examples',
              '',
              '**Summary**',
              '',
              `- Passed suites: ${passed}`,
              `- Failed suites: ${failed}`,
              '- Node runtime: 22.14.0',
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
