name: Publish Library

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run verify

      - name: Build library
        run: npm run build:lib

      - name: Verify dist output
        run: |
          echo "Checking dist directory..."
          ls -la packages/enterprise-blockchain/dist/
          echo "Checking type declarations..."
          ls -la packages/enterprise-blockchain/dist/*.d.ts || true
          ls -la packages/enterprise-blockchain/dist/mpc/*.d.ts || true

      - name: Publish to npm (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish -w @psavelis/enterprise-blockchain --access public --dry-run

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: npm publish -w @psavelis/enterprise-blockchain --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
