// Stone Prover gRPC Service Definition
//
// Defines the protocol buffer messages and service for communicating
// with the Stone STARK prover. The prover executes Cairo programs and
// generates cryptographically valid STARK proofs.
//
// References:
// - https://github.com/starkware-libs/stone-prover
// - https://github.com/Moonsong-Labs/madara-prover-api

syntax = "proto3";

package prover;

option go_package = "github.com/enterprise-blockchain/prover";

// ProverService provides STARK proof generation and verification.
//
// Note: This service includes a Health RPC for application-level health info
// (active jobs, memory, version). For Kubernetes liveness/readiness probes,
// containers should also implement the standard grpc.health.v1.Health service
// which is checked by grpc_health_probe.
service ProverService {
  // ExecuteAndProve runs a Cairo program and generates a STARK proof.
  rpc ExecuteAndProve(ExecuteAndProveRequest) returns (ExecuteAndProveResponse);

  // Verify checks the validity of a STARK proof.
  rpc Verify(VerifyRequest) returns (VerifyResponse);

  // Health returns detailed prover health status including job counts,
  // memory usage, and version info. This is for application-level monitoring.
  // For K8s probes, use the standard grpc.health.v1.Health service.
  rpc Health(HealthRequest) returns (HealthResponse);

  // GetCapabilities returns prover capabilities and configuration.
  rpc GetCapabilities(CapabilitiesRequest) returns (CapabilitiesResponse);
}

// ExecuteAndProveRequest contains the Cairo program and inputs for proof generation.
message ExecuteAndProveRequest {
  // Compiled Cairo program (Sierra JSON or CASM)
  bytes program = 1;

  // Public inputs as field elements (hex-encoded)
  repeated string public_inputs = 2;

  // Private inputs (witness data)
  bytes private_input = 3;

  // Program entry point (function name)
  string entry_point = 4;

  // Optional: proof generation parameters
  ProofParameters parameters = 5;

  // Request ID for tracking
  string request_id = 6;
}

// ProofParameters configures proof generation behavior.
message ProofParameters {
  // Number of FRI layers (affects proof size vs generation time)
  uint32 fri_layers = 1;

  // Last layer degree bound
  uint32 last_layer_degree_bound = 2;

  // Proof of work difficulty bits
  uint32 proof_of_work_bits = 3;

  // Security level in bits (default: 96)
  uint32 security_bits = 4;
}

// ExecuteAndProveResponse contains the generated STARK proof.
message ExecuteAndProveResponse {
  // The STARK proof bytes
  bytes proof = 1;

  // Public outputs from program execution
  repeated string public_outputs = 2;

  // Execution trace length
  uint64 trace_length = 3;

  // Proof generation time in milliseconds
  uint64 generation_time_ms = 4;

  // Proof size in bytes
  uint64 proof_size_bytes = 5;

  // Memory usage during generation (bytes)
  uint64 memory_usage_bytes = 6;

  // Request ID (echoed back)
  string request_id = 7;
}

// VerifyRequest contains a proof to verify.
message VerifyRequest {
  // The STARK proof to verify
  bytes proof = 1;

  // Public inputs that were used during proof generation
  repeated string public_inputs = 2;

  // Public outputs from the proof
  repeated string public_outputs = 3;

  // Verification key hash (for circuit identification)
  string verification_key_hash = 4;

  // Request ID for tracking
  string request_id = 5;
}

// VerifyResponse indicates whether the proof is valid.
message VerifyResponse {
  // Whether the proof is valid
  bool valid = 1;

  // Error message if verification failed
  string error = 2;

  // Verification time in milliseconds
  uint64 verification_time_ms = 3;

  // Request ID (echoed back)
  string request_id = 4;
}

// HealthRequest is an empty health check request.
message HealthRequest {}

// HealthResponse indicates prover health status.
message HealthResponse {
  // Whether the prover is healthy and ready
  bool healthy = 1;

  // Current status message
  string status = 2;

  // Number of proof jobs currently in progress
  uint32 active_jobs = 3;

  // Maximum concurrent jobs allowed
  uint32 max_jobs = 4;

  // Available memory in bytes
  uint64 available_memory_bytes = 5;

  // Prover version
  string version = 6;

  // Uptime in seconds
  uint64 uptime_seconds = 7;
}

// CapabilitiesRequest queries prover capabilities.
message CapabilitiesRequest {}

// CapabilitiesResponse describes prover capabilities.
message CapabilitiesResponse {
  // Supported Cairo versions
  repeated string supported_cairo_versions = 1;

  // Maximum program size in bytes
  uint64 max_program_size_bytes = 2;

  // Maximum trace length
  uint64 max_trace_length = 3;

  // Whether recursive proofs are supported
  bool supports_recursive_proofs = 4;

  // Supported hash functions
  repeated string supported_hash_functions = 5;

  // Default proof parameters
  ProofParameters default_parameters = 6;
}
